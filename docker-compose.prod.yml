# Production deployment of the three KORVA images behind a TLS-terminating reverse proxy.
#
# NOT the same file as docker-compose.yml — that one exists only to give local development a
# MongoDB and a Redis, and it runs no application container at all.
#
# MongoDB is NOT here, Redis IS, and the asymmetry is deliberate rather than an oversight.
#
# MongoDB holds the system of record — invoices, payments, subscriptions, every tenant's data.
# Running it as a sibling container with no managed backups, no point-in-time recovery and no
# failover is survivable right up until it isn't. MONGODB_URI must point at a managed replica
# set (Atlas or equivalent). A replica set is REQUIRED, not preferred: financial writes use
# multi-document transactions, which MongoDB only supports on one.
#
# Redis holds BullMQ's queues, which have a completely different loss profile: the schedulers
# re-derive their worklists from MongoDB's current state on the next sweep, so losing the queues
# costs at worst some in-flight events, never a financial record. That tolerance is what makes
# a local Redis the right call — and it removes the real problem with a per-request-billed
# managed Redis, which this application is a poor fit for: 13 BullMQ workers and 13 QueueEvents
# listeners keep 26 blocking loops re-arming every few seconds with zero business activity. See
# docs/deployment.md's "Modèle de coût Redis".
#
# Usage:
#   cp .env.production.example .env.production   # then fill it in
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
#
# Images are built from the repo root as context, never from an app directory — each Dockerfile
# needs the other workspace packages' manifests to resolve `workspace:*`.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # `--appendonly yes` so a restart does not drop queued jobs on the floor. `--maxmemory-policy
    # noeviction` is not optional for BullMQ: under an eviction policy Redis would silently drop
    # queue keys when memory fills, and a lost job looks exactly like a job that never existed.
    # Failing writes loudly is the only acceptable behavior for a queue broker.
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD}
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
    # No `ports:` — reachable only on the compose network. A Redis exposed on a host port with
    # only a password in front of it is one scan away from being someone else's.
    expose:
      - "6379"
    volumes:
      - korva_redis_data:/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: [.env.production]
    environment:
      NODE_ENV: production
      PORT: "4000"
    expose:
      - "4000"
    # No `ports:` on any app service on purpose — only Caddy binds a host port. An API reachable
    # directly on :4000 would bypass TLS termination and the proxy's rate limiting.
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Next.js inlines NEXT_PUBLIC_* into the CLIENT bundle at BUILD time, so this is a build
        # arg and not a runtime variable. Changing it later means rebuilding the image; setting it
        # only in the environment silently ships a bundle pointing at localhost.
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL}
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DASHBOARD_DOMAIN: ${DASHBOARD_DOMAIN}
      API_DOMAIN: ${API_DOMAIN}
      STOREFRONT_DOMAIN: ${STOREFRONT_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Issued certificates live here. Losing this volume means re-requesting every certificate
      # on the next boot, which is the fastest way to hit Let's Encrypt's rate limits.
      - korva_caddy_data:/data
      - korva_caddy_config:/config
    # Caddy proxies these, so it starts after them. The previous graph had `api` waiting on
    # `caddy`, which is backwards: Caddy's on-demand-TLS `ask` endpoint calls the API, so an API
    # that waits for Caddy waits for something that needs it first.
    depends_on:
      - api
      - web
      - storefront

volumes:
  korva_redis_data:
  korva_caddy_data:
  korva_caddy_config:
