name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # GitHub Actions service containers don't support a custom `command:` — mongod needs
    # --replSet (financial writes need multi-document transactions, which MongoDB only
    # supports on a replica set, never a bare standalone) so mongodb is started explicitly
    # in the "Start MongoDB (replica set rs0)" step below instead of as a service.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://korva:korva@localhost:27017/korva_test?authSource=admin&replicaSet=rs0
      REDIS_URL: redis://localhost:6380
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB (replica set rs0)
        run: |
          set -e
          # mongod refuses --replSet + auth without a keyFile, even for a single-node set —
          # generate one at container boot (root, before mongod drops to the mongodb user)
          # instead of bind-mounting a file from the runner, which would carry the wrong
          # ownership for mongod to read.
          cat > /tmp/mongo-entrypoint.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p /data/keyfile
          head -c 756 /dev/urandom | base64 -w 0 > /data/keyfile/mongo-keyfile
          chmod 400 /data/keyfile/mongo-keyfile
          chown mongodb:mongodb /data/keyfile/mongo-keyfile
          exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/keyfile/mongo-keyfile
          EOF
          chmod +x /tmp/mongo-entrypoint.sh

          docker run -d --name mongodb -p 27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=korva \
            -e MONGO_INITDB_ROOT_PASSWORD=korva \
            -e MONGO_INITDB_DATABASE=korva \
            -v /tmp/mongo-entrypoint.sh:/mongo-entrypoint.sh:ro \
            --entrypoint bash \
            mongo:7 /mongo-entrypoint.sh

          echo "Waiting for mongod to accept connections..."
          ready=false
          for i in $(seq 1 30); do
            if docker exec mongodb mongosh --quiet -u korva -p korva --authenticationDatabase admin --eval "db.adminCommand('ping')" >/dev/null 2>&1; then
              echo "mongod is up"
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "mongod never became reachable" >&2
            docker logs mongodb
            exit 1
          fi

          echo "Initiating replica set rs0 (idempotent)..."
          docker exec mongodb mongosh --quiet -u korva -p korva --authenticationDatabase admin --eval '
            try {
              rs.status();
              print("rs0 already initialized");
            } catch (e) {
              if (e.codeName === "NotYetInitialized") {
                rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] });
                print("rs0 initiated");
              } else {
                throw e;
              }
            }
          '

          echo "Waiting for PRIMARY..."
          primary=false
          for i in $(seq 1 30); do
            state=$(docker exec mongodb mongosh --quiet -u korva -p korva --authenticationDatabase admin --eval "rs.status().myState" 2>/dev/null || echo "")
            if [ "$state" = "1" ]; then
              echo "rs0 PRIMARY is up"
              primary=true
              break
            fi
            sleep 2
          done
          if [ "$primary" != "true" ]; then
            echo "rs0 never reached PRIMARY" >&2
            exit 1
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Build
        run: pnpm -r build

      - name: Unit tests (api)
        run: pnpm --filter @korva/api test

      # apps/web, apps/storefront and packages/ui carry ~580 Vitest tests between them that this
      # workflow never ran — only the api suite was wired in, so a frontend regression could
      # reach main with CI green. Run as its own step so a failure names the frontend directly
      # rather than hiding inside a recursive command's output.
      - name: Unit tests (web, storefront, ui)
        run: pnpm --filter @korva/web --filter @korva/storefront --filter @korva/ui test

      - name: E2E tests
        run: pnpm --filter @korva/api test:e2e

  # Fails on any high or critical advisory that is not explicitly declared in
  # pnpm-workspace.yaml's `auditConfig.ignoreGhsas`, each of which carries a written
  # reachability argument. Independent of build-and-test (no `needs:`) so a dependency advisory
  # is reported even when a test is failing for an unrelated reason.
  dependency-audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # `pnpm audit` resolves the dependency graph from the lockfile and queries the registry;
      # it needs no node_modules, so the install is skipped entirely.
      - name: Audit dependencies (high and critical)
        run: pnpm audit --audit-level high

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test

    # Verification only: builds the 3 production images from their real Dockerfiles and boots
    # each one just enough to prove it actually starts. Never pushes anywhere — no registry
    # credentials are used or required. Not a deployment step.
    #
    # GitHub Actions service containers don't support a custom `command:` — mongod needs
    # --replSet (financial writes need multi-document transactions, which MongoDB only
    # supports on a replica set, never a bare standalone) so mongodb is started explicitly
    # in the "Start MongoDB (replica set rs0)" step below instead of as a service.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # Same ephemeral, CI-only dummy values already used by build-and-test above — nothing
      # here is a real secret, and none of it is needed merely to BUILD the images (only to
      # boot the API container for the smoke test below).
      MONGODB_URI: mongodb://korva:korva@localhost:27017/korva_test?authSource=admin&replicaSet=rs0
      REDIS_URL: redis://localhost:6380
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB (replica set rs0)
        run: |
          set -e
          cat > /tmp/mongo-entrypoint.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          mkdir -p /data/keyfile
          head -c 756 /dev/urandom | base64 -w 0 > /data/keyfile/mongo-keyfile
          chmod 400 /data/keyfile/mongo-keyfile
          chown mongodb:mongodb /data/keyfile/mongo-keyfile
          exec docker-entrypoint.sh mongod --replSet rs0 --bind_ip_all --keyFile /data/keyfile/mongo-keyfile
          EOF
          chmod +x /tmp/mongo-entrypoint.sh

          docker run -d --name mongodb -p 27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=korva \
            -e MONGO_INITDB_ROOT_PASSWORD=korva \
            -e MONGO_INITDB_DATABASE=korva \
            -v /tmp/mongo-entrypoint.sh:/mongo-entrypoint.sh:ro \
            --entrypoint bash \
            mongo:7 /mongo-entrypoint.sh

          echo "Waiting for mongod to accept connections..."
          ready=false
          for i in $(seq 1 30); do
            if docker exec mongodb mongosh --quiet -u korva -p korva --authenticationDatabase admin --eval "db.adminCommand('ping')" >/dev/null 2>&1; then
              echo "mongod is up"
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != "true" ]; then
            echo "mongod never became reachable" >&2
            docker logs mongodb
            exit 1
          fi

          echo "Initiating replica set rs0 (idempotent)..."
          docker exec mongodb mongosh --quiet -u korva -p korva --authenticationDatabase admin --eval '
            try {
              rs.status();
              print("rs0 already initialized");
            } catch (e) {
              if (e.codeName === "NotYetInitialized") {
                rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "localhost:27017" }] });
                print("rs0 initiated");
              } else {
                throw e;
              }
            }
          '

          echo "Waiting for PRIMARY..."
          primary=false
          for i in $(seq 1 30); do
            state=$(docker exec mongodb mongosh --quiet -u korva -p korva --authenticationDatabase admin --eval "rs.status().myState" 2>/dev/null || echo "")
            if [ "$state" = "1" ]; then
              echo "rs0 PRIMARY is up"
              primary=true
              break
            fi
            sleep 2
          done
          if [ "$primary" != "true" ]; then
            echo "rs0 never reached PRIMARY" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: korva-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: korva-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build Storefront image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/storefront/Dockerfile
          push: false
          load: true
          tags: korva-storefront:ci
          cache-from: type=gha,scope=storefront
          cache-to: type=gha,mode=max,scope=storefront

      # --network host so the container can reach the mongodb/redis service containers on
      # localhost, exactly like the non-Docker Unit/E2E steps above already do.
      - name: Smoke test API image
        run: |
          docker run -d --name korva-api-smoke --network host \
            -e NODE_ENV=production \
            -e MONGODB_URI \
            -e REDIS_URL \
            -e JWT_SECRET \
            -e JWT_REFRESH_SECRET \
            -e CORS_ORIGINS=http://localhost:3000 \
            korva-api:ci
          ok=false
          for i in $(seq 1 20); do
            if curl -sf http://localhost:4000/api/v1/health >/dev/null; then
              echo "API image booted and /api/v1/health responded OK"
              ok=true
              break
            fi
            sleep 3
          done
          docker logs korva-api-smoke
          docker stop korva-api-smoke
          $ok

      - name: Smoke test Web image
        run: |
          docker run -d --name korva-web-smoke -p 3100:3000 korva-web:ci
          ok=false
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3100/ >/dev/null; then
              echo "Web image booted and / responded OK"
              ok=true
              break
            fi
            sleep 2
          done
          docker logs korva-web-smoke
          docker stop korva-web-smoke
          $ok

      - name: Smoke test Storefront image
        run: |
          docker run -d --name korva-storefront-smoke -p 3101:3000 korva-storefront:ci
          ok=false
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3101/ >/dev/null; then
              echo "Storefront image booted and / responded OK"
              ok=true
              break
            fi
            sleep 2
          done
          docker logs korva-storefront-smoke
          docker stop korva-storefront-smoke
          $ok
