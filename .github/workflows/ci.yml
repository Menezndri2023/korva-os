name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: korva
          MONGO_INITDB_ROOT_PASSWORD: korva
          MONGO_INITDB_DATABASE: korva
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ping:1})' -u korva -p korva --authenticationDatabase admin"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://korva:korva@localhost:27017/korva_test?authSource=admin
      REDIS_URL: redis://localhost:6380
      JWT_SECRET: ci-jwt-secret
      JWT_REFRESH_SECRET: ci-jwt-refresh-secret

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm -r lint

      - name: Build
        run: pnpm -r build

      - name: Unit tests
        run: pnpm --filter @korva/api test

      - name: E2E tests
        run: pnpm --filter @korva/api test:e2e
